{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#08272b" />
  <meta name="description" content="Conecta Território 3D — explore territórios, mapas e dados geográficos." />
  <title>Conecta Território 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --ink: #152b2e;
  --muted: #718084;
  --muted-2: #9aa7a9;
  --line: #e4eae8;
  --surface: #ffffff;
  --canvas: #f5f8f7;
  --nav: #08272b;
  --nav-soft: #10383b;
  --green: #21b99a;
  --green-dark: #0d806c;
  --green-pale: #e5f5f0;
  --blue: #3985a2;
  --amber: #d6a748;
  --radius: 13px;
  --shadow: 0 8px 28px rgba(15, 47, 47, .055);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--canvas); color: var(--ink); font-family: 'DM Sans', sans-serif; }
button, input { font: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
#app { min-height: 100vh; }
.logo-mark { width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(145deg, #27c5a4, #0b796c); display: grid; place-items: center; flex: 0 0 auto; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
.logo-mark svg { width: 26px; height: 26px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-name { font: 800 16px/1.15 'Manrope', sans-serif; letter-spacing: -.45px; }
.brand-sub { font-size: 10px; opacity: .7; margin-top: 3px; letter-spacing: .3px; }
/* Authentication */
.auth-page { min-height: 100vh; padding: 22px; display: grid; grid-template-columns: minmax(480px, 1.04fr) minmax(420px, .96fr); gap: 22px; background: #f8faf9; }
.auth-visual { min-height: calc(100vh - 44px); border-radius: 4px; overflow: hidden; position: relative; color: #f2f7f5; background: #08272b; padding: clamp(30px, 4vw, 58px); display: flex; flex-direction: column; }
.auth-visual:after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(1,18,22,.02), rgba(1,18,22,.18)); }
.auth-visual > * { position: relative; z-index: 1; }
.auth-visual .brand-name { font-size: 18px; }
.auth-eyebrow { margin-top: 64px; display: inline-flex; align-items: center; gap: 9px; padding: 8px 13px; border: 1px solid rgba(125,205,185,.22); border-radius: 40px; background: rgba(43,111,103,.19); color: #d5e9e2; font-size: 10px; letter-spacing: .55px; width: fit-content; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #bedc48; box-shadow: 0 0 0 3px rgba(190,220,72,.1); }
.auth-visual h1 { max-width: 620px; margin: 24px 0 10px; font: 800 clamp(34px, 3.3vw, 48px)/1.16 'Manrope', sans-serif; letter-spacing: -1.8px; }
.auth-visual .lead { max-width: 510px; margin: 0; color: #b8c9c8; font-size: 14px; line-height: 1.65; }
.auth-map { width: min(100%, 650px); height: auto; margin: 24px auto 10px; flex: 1 1 auto; min-height: 220px; max-height: 410px; }
.auth-features { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.feature-chip { display: flex; align-items: center; gap: 11px; min-height: 54px; border: 1px solid rgba(118,186,172,.2); background: rgba(19,66,67,.42); border-radius: 9px; padding: 9px 12px; }
.feature-icon { width: 27px; height: 27px; border-radius: 7px; background: rgba(59,157,137,.2); color: #75d6bf; display: grid; place-items: center; flex: 0 0 auto; }
.feature-icon svg { width: 15px; height: 15px; }
.feature-chip strong { display: block; font-size: 10px; font-weight: 600; }
.feature-chip small { display: block; color: #9fb7b5; font-size: 9px; margin-top: 3px; }
.auth-foot { margin-top: 22px; font-size: 9px; letter-spacing: .65px; color: #6d9290; }
.auth-side { min-height: calc(100vh - 44px); display: flex; flex-direction: column; padding: 22px clamp(24px, 5vw, 72px); }
.auth-top { display: flex; justify-content: flex-end; align-items: center; gap: 26px; color: #899698; font-size: 10px; }
.auth-top button, .auth-bottom button, .text-button { border: 0; padding: 0; background: transparent; color: var(--green-dark); font-size: inherit; font-weight: 700; }
.auth-form-wrap { width: 100%; max-width: 430px; margin: auto; padding: 30px 0; }
.auth-form-wrap h2 { font: 700 27px 'Manrope', sans-serif; letter-spacing: -.7px; margin: 0 0 5px; color: #172c31; }
.form-subtitle { margin: 0 0 26px; color: #879395; font-size: 12px; }
.google-button { width: 100%; height: 43px; border: 1px solid #e2e8e7; border-radius: 8px; background: white; color: #314144; font-size: 12px; font-weight: 600; display: flex; gap: 10px; align-items: center; justify-content: center; transition: border .2s, background .2s; }
.google-button:hover { border-color: #b8cfca; background: #fbfdfc; }
.google-g { font: 700 17px Arial, sans-serif; color: #4285f4; }
.form-divider { display: flex; gap: 12px; align-items: center; color: #a1acad; font-size: 9px; margin: 20px 0 24px; }
.form-divider:before, .form-divider:after { content: ''; height: 1px; background: #e8edeb; flex: 1; }
.field { display: block; margin-bottom: 17px; }
.field-label { display: block; position: relative; color: #667477; font-size: 10px; font-weight: 600; margin: 0 0 7px 2px; }
.field input { width: 100%; height: 45px; border: 1px solid #dce4e1; border-radius: 7px; padding: 0 13px; background: #fff; outline: none; color: var(--ink); font-size: 12px; transition: border .2s, box-shadow .2s; }
.field input::placeholder { color: #a4adae; }
.field input:focus { border-color: #40b99e; box-shadow: 0 0 0 3px rgba(33,185,154,.1); }
.form-options { display: flex; justify-content: space-between; align-items: center; margin: -1px 0 21px; font-size: 10px; color: #819092; }
.check-label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
.check-label input { accent-color: var(--green-dark); }
.primary-button { min-height: 43px; border: 0; border-radius: 8px; background: #35cba9; color: #073c37; font-weight: 700; font-size: 12px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; gap: 15px; transition: background .18s, transform .18s; }
.primary-button:hover { background: #26bd9b; transform: translateY(-1px); }
.primary-button.full { width: 100%; }
.primary-button svg { width: 16px; height: 16px; }
.auth-bottom { text-align: center; margin-top: 16px; color: #899596; font-size: 10px; }
.auth-privacy { text-align: center; font-size: 9px; line-height: 1.6; color: #aab4b3; margin-top: 35px; }
/* App shell */
.app-shell { min-height: 100vh; display: grid; grid-template-columns: 238px minmax(0,1fr); }
.sidebar { background: var(--nav); color: #dce8e6; min-height: 100vh; display: flex; flex-direction: column; padding: 24px 14px 17px; position: sticky; top: 0; height: 100vh; }
.sidebar .brand { padding: 0 10px 25px; border-bottom: 1px solid rgba(209,236,229,.1); }
.sidebar .brand-name { font-size: 15px; }
.sidebar .logo-mark { width: 36px; height: 36px; border-radius: 9px; }
.nav-list { display: grid; gap: 5px; padding-top: 22px; }
.nav-item { border: 0; width: 100%; text-align: left; color: #b7c9c7; background: transparent; padding: 11px 13px; border-radius: 8px; display: flex; align-items: center; gap: 13px; font-size: 12px; transition: color .15s, background .15s; }
.nav-item:hover { color: white; background: rgba(255,255,255,.055); }
.nav-item.active { color: #72e0c6; background: #103d3e; box-shadow: inset 3px 0 #39c9a9; }
.nav-icon { width: 19px; height: 19px; display: grid; place-items: center; color: currentColor; }
.nav-icon svg { width: 18px; height: 18px; stroke: currentColor; }
.sidebar-help { margin-top: auto; border-top: 1px solid rgba(209,236,229,.1); padding: 18px 8px 0; }
.sidebar-help strong { display: block; color: #e8f1ef; font-size: 11px; margin-bottom: 5px; }
.sidebar-help span { display: block; color: #94aaa7; font-size: 10px; line-height: 1.5; }
.main-area { min-width: 0; }
.topbar { height: 70px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.88); display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 35px; }
.breadcrumb { font-size: 11px; color: #8a9798; }
.breadcrumb b { color: #33494a; font-weight: 600; }
.top-actions { display: flex; align-items: center; gap: 22px; }
.global-search { width: min(330px, 31vw); height: 38px; border: 1px solid #e3e9e7; background: #fbfcfc; border-radius: 8px; display: flex; align-items: center; gap: 9px; padding: 0 12px; }
.global-search svg { width: 16px; color: #82918f; }
.global-search input { border: 0; outline: 0; background: transparent; width: 100%; font-size: 11px; color: var(--ink); }
.global-search input::placeholder { color: #9aa6a5; }
.profile { display: flex; align-items: center; gap: 9px; color: #425456; font-size: 11px; font-weight: 600; white-space: nowrap; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: #e5f0eb; color: #287c6d; display: grid; place-items: center; font-size: 10px; font-weight: 700; }
.page-content { padding: 30px 35px 42px; max-width: 1600px; margin: 0 auto; }
.page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
.page-heading h1 { margin: 0 0 6px; font: 700 26px 'Manrope', sans-serif; letter-spacing: -.8px; color: #192f32; }
.page-heading p { margin: 0; color: #829092; font-size: 12px; }
/* Dashboard */
.stats-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; margin-bottom: 19px; }
.stat-card, .panel { background: white; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.stat-card { padding: 17px 19px; min-height: 108px; position: relative; }
.stat-label { color: #7e8b8d; font-size: 11px; font-weight: 600; }
.stat-value { font: 700 27px 'Manrope',sans-serif; letter-spacing: -.7px; margin-top: 7px; }
.stat-detail { color: #99a4a4; font-size: 10px; margin-top: 2px; }
.stat-icon { position: absolute; right: 17px; top: 18px; width: 30px; height: 30px; border-radius: 8px; background: var(--green-pale); color: var(--green-dark); display: grid; place-items: center; }
.stat-icon svg { width: 16px; }
.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(260px, .92fr); gap: 18px; }
.panel { padding: 18px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.panel-head h2 { font: 700 15px 'Manrope',sans-serif; margin: 0; letter-spacing: -.2px; }
.panel-head p { margin: 4px 0 0; color: #8b9899; font-size: 10px; }
.inline-link { border: 0; background: transparent; color: var(--green-dark); font-size: 10px; font-weight: 700; padding: 5px; white-space: nowrap; }
.map-preview, .map-large { position: relative; overflow: hidden; background: #eaf1ed; border-radius: 9px; }
.map-preview { height: 278px; }
.map-preview svg, .map-large svg { width: 100%; height: 100%; display: block; }
.map-caption { position: absolute; bottom: 11px; left: 13px; padding: 6px 9px; border-radius: 6px; background: rgba(255,255,255,.88); color: #657674; font-size: 9px; }
.project-list { display: grid; }
.project-row { display: flex; gap: 11px; align-items: center; padding: 12px 0; border-bottom: 1px solid #edf1ef; }
.project-row:last-child { border-bottom: 0; }
.project-thumb { width: 54px; height: 48px; border-radius: 7px; flex: 0 0 auto; background: #dcebe2; display: grid; place-items: center; color: #468674; font-size: 9px; font-weight: 700; letter-spacing: .5px; }
.project-thumb.blue { background: #e1edf0; color: #4a8293; }
.project-thumb.gold { background: #f3eddf; color: #a98945; }
.project-info { min-width: 0; flex: 1; }
.project-info strong { display: block; font-size: 11px; font-weight: 700; margin-bottom: 4px; }
.project-info small { display: block; color: #94a09f; font-size: 9px; }
.quick-panel { margin-top: 18px; }
.quick-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
.quick-link { display: flex; gap: 10px; align-items: center; border: 1px solid #e9efec; border-radius: 9px; padding: 13px; background: #fcfdfd; text-align: left; }
.quick-link:hover { background: #f4fbf8; border-color: #cde7dd; }
.quick-icon { height: 34px; width: 34px; border-radius: 8px; background: #e6f5f0; color: #188c75; display: grid; place-items: center; flex: 0 0 auto; }
.quick-icon svg { width: 17px; }
.quick-link strong { display: block; font-size: 10px; }
.quick-link small { display: block; color: #9aa5a4; margin-top: 3px; font-size: 9px; }
/* Map explorer */
.explore-top { display: flex; align-items: center; gap: 10px; margin: 0 0 17px; }
.explore-search { flex: 1; height: 42px; background: white; border: 1px solid var(--line); border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 13px; }
.explore-search svg { width: 17px; color: #81918f; }
.explore-search input { border: 0; outline: 0; width: 100%; font-size: 11px; }
.explore-layout { display: grid; grid-template-columns: minmax(0,1fr) 275px; gap: 17px; }
.map-workspace { padding: 17px; }
.map-large { height: min(58vh, 560px); min-height: 370px; }
.map-tools { position: absolute; top: 14px; left: 14px; display: grid; gap: 5px; }
.map-tools button { width: 34px; height: 34px; border: 1px solid #dbe5e0; border-radius: 7px; background: rgba(255,255,255,.94); color: #3c5553; font-size: 17px; }
.map-legend { position: absolute; top: 14px; right: 14px; padding: 11px 13px; background: rgba(255,255,255,.94); border: 1px solid #e0e8e3; border-radius: 8px; display: grid; gap: 9px; color: #596a68; font-size: 9px; }
.legend-item { display: flex; align-items: center; gap: 7px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }
.map-coordinates { position: absolute; right: 12px; bottom: 12px; background: rgba(255,255,255,.88); color: #697a76; border-radius: 6px; padding: 6px 8px; font-size: 9px; }
.side-stack { display: grid; align-content: start; gap: 15px; }
.layer-list { display: grid; }
.layer-row { display: flex; align-items: center; gap: 9px; padding: 12px 0; border-bottom: 1px solid #edf1ef; }
.layer-row:last-child { border: 0; }
.layer-swatch { width: 28px; height: 28px; border-radius: 7px; flex: 0 0 auto; }
.layer-copy { flex: 1; min-width: 0; }
.layer-copy strong { display: block; font-size: 10px; }
.layer-copy small { display: block; color: #98a4a2; font-size: 9px; margin-top: 3px; }
.toggle { width: 31px; height: 18px; border: 0; border-radius: 20px; background: #cbd4d1; padding: 2px; transition: background .2s; flex: 0 0 auto; }
.toggle:after { content: ''; display: block; height: 14px; width: 14px; border-radius: 50%; background: white; transition: transform .2s; box-shadow: 0 1px 2px #0002; }
.toggle.on { background: #25b797; }
.toggle.on:after { transform: translateX(13px); }
.region-details { display: grid; gap: 12px; }
.region-details small { color: #98a4a2; font-size: 9px; display: block; margin-bottom: 4px; }
.region-details strong { font-size: 11px; }
/* Secondary pages */
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
.toolbar input { height: 39px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; background: white; min-width: 230px; font-size: 11px; outline: 0; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 620px; }
th { color: #879493; font-size: 9px; font-weight: 700; text-align: left; padding: 12px 13px; background: #fafcfb; letter-spacing: .45px; text-transform: uppercase; }
td { border-top: 1px solid #edf1ef; padding: 14px 13px; font-size: 11px; color: #4c5e5e; }
td strong { color: #263c3e; }
.status { display: inline-flex; align-items: center; gap: 5px; border-radius: 30px; padding: 5px 8px; background: #e8f6ef; color: #25836b; font-size: 9px; font-weight: 700; }
.status.gray { background: #f0f2f1; color: #778482; }
.empty-state { text-align: center; padding: 40px 15px; color: #92a09e; font-size: 11px; }
/* Modal and toast */
.modal-backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(7,27,29,.42); display: grid; place-items: center; padding: 18px; }
.modal { width: min(100%, 440px); background: white; border-radius: 14px; padding: 24px; box-shadow: 0 20px 70px #001b1b38; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 17px; }
.modal-head h2 { margin: 0; font: 700 18px 'Manrope',sans-serif; }
.close-button { border: 0; background: #f1f5f3; border-radius: 7px; width: 30px; height: 30px; color: #667573; font-size: 18px; }
.toast { position: fixed; z-index: 50; left: 50%; bottom: 24px; transform: translate(-50%, 18px); padding: 11px 16px; border-radius: 8px; background: #123b39; color: #f1faf6; box-shadow: 0 8px 24px #001b1b30; font-size: 11px; opacity: 0; pointer-events: none; transition: .22s; }
.toast.show { opacity: 1; transform: translate(-50%,0); }
@media (max-width: 1050px) {
 .auth-page { grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
 .auth-visual, .auth-side { min-height: calc(100vh - 24px); }
 .auth-visual { padding: 28px; }
 .auth-eyebrow { margin-top: 40px; }
 .app-shell { grid-template-columns: 205px minmax(0,1fr); }
 .page-content { padding: 25px 22px; }
 .topbar { padding: 0 22px; }
 .dashboard-grid { grid-template-columns: minmax(0,1.4fr) minmax(230px,.9fr); }
}
@media (max-width: 760px) {
 .auth-page { display: block; padding: 0; }
 .auth-visual { min-height: 480px; border-radius: 0; padding: 28px 24px; }
 .auth-eyebrow { margin-top: 37px; }
 .auth-visual h1 { font-size: 35px; }
 .auth-map { min-height: 165px; max-height: 230px; margin: 12px auto; }
 .auth-side { min-height: 560px; padding: 22px 25px; }
 .auth-form-wrap { margin: 20px auto; }
 .app-shell { display: block; }
 .sidebar { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; top: auto; height: 64px; min-height: 0; padding: 5px 8px; display: block; }
 .sidebar .brand, .sidebar-help { display: none; }
 .nav-list { display: flex; justify-content: space-around; gap: 1px; padding: 0; }
 .nav-item { width: auto; min-width: 0; padding: 7px 8px; flex-direction: column; gap: 3px; border-radius: 7px; font-size: 8px; }
 .nav-item.active { box-shadow: inset 0 2px #39c9a9; }
 .nav-icon svg { width: 17px; height: 17px; }
 .topbar { height: 58px; padding: 0 15px; }
 .breadcrumb { font-size: 10px; }
 .top-actions { gap: 10px; }
 .global-search { width: min(44vw,230px); height: 34px; }
 .profile { font-size: 0; gap: 0; }
 .avatar { width: 28px; height: 28px; font-size: 10px; }
 .page-content { padding: 23px 15px 88px; }
 .page-heading { margin-bottom: 18px; }
 .page-heading h1 { font-size: 22px; }
 .page-heading p { font-size: 10px; }
 .stats-grid { gap: 8px; }
 .stat-card { padding: 12px; min-height: 98px; }
 .stat-label { font-size: 9px; }
 .stat-value { font-size: 22px; }
 .stat-detail { font-size: 8px; }
 .stat-icon { width: 24px; height: 24px; top: 10px; right: 9px; }
 .dashboard-grid, .explore-layout { grid-template-columns: 1fr; }
 .map-preview { height: 220px; }
 .quick-grid { grid-template-columns: 1fr; }
 .quick-link { padding: 10px; }
 .map-large { min-height: 330px; height: 48vh; }
 .explore-top { flex-wrap: wrap; }
 .explore-search { flex-basis: 100%; }
 .side-stack { grid-template-columns: 1fr; }
 .toolbar { flex-wrap: wrap; }
 .toolbar input { flex: 1; min-width: 150px; }
}
@media (max-width: 390px) {
 .nav-item { padding: 7px 5px; font-size: 7px; }
 .stats-grid { grid-template-columns: 1fr 1fr; }
 .stats-grid .stat-card:last-child { grid-column: span 2; }
 .auth-features { gap: 7px; }
 .feature-chip { padding: 8px; }
}

  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
(() => {
  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');
  const state = {
    view: 'login',
    user: null,
    projects: [
      { name: 'Zoneamento urbano', place: 'Recife · PE', updated: 'Atualizado hoje', type: 'MAP', status: 'Em andamento' },
      { name: 'Bacia hidrográfica', place: 'São Francisco · PE', updated: 'Editado ontem', type: 'H₂O', status: 'Concluído' },
      { name: 'Uso e cobertura do solo', place: 'Jaboatão · PE', updated: 'Editado há 3 dias', type: 'GIS', status: 'Em andamento' },
      { name: 'Limites municipais', place: 'Região Metropolitana · PE', updated: 'Editado há 1 semana', type: 'MAP', status: 'Concluído' }
    ],
    layers: [
      { name: 'Elevação', desc: 'Relevo e altitude', color: '#279a7b', on: true },
      { name: 'Hidrografia', desc: 'Rios e corpos d’água', color: '#4c91ad', on: true },
      { name: 'Uso do solo', desc: 'Cobertura do terreno', color: '#d1a64d', on: false },
      { name: 'Limites municipais', desc: 'Divisões administrativas', color: '#71817b', on: true }
    ],
    search: '',
    selectedRegion: 'Pernambuco',
    modalOpen: false
  };

    return `${heading('Projetos', 'Organize seus estudos, mapas e análises territoriais.', `<button class="primary-button" data-action="new-project">${icon('plus')} Novo projeto</button>`)}
      <div class="toolbar"><input id="page-search" type="search" placeholder="Pesquisar projeto..." value="${escapeHtml(state.search)}"><button class="inline-link" data-action="clear-search">Limpar filtros</button></div>
      <article class="panel table-wrap"><table><thead><tr><th>Projeto</th><th>Localização</th><th>Última atualização</th><th>Status</th><th>Tipo</th></tr></thead><tbody>${rows.map(p => `<tr><td><strong>${escapeHtml(p.name)}</strong></td><td>${escapeHtml(p.place)}</td><td>${escapeHtml(p.updated)}</td><td><span class="status ${p.status === 'Concluído' ? 'gray' : ''}">${escapeHtml(p.status)}</span></td><td>${escapeHtml(p.type)}</td></tr>`).join('')}</tbody></table>${rows.length ? '' : '<div class="empty-state">Nenhum projeto corresponde à pesquisa.</div>'}</article>`;
  }

  function layersView() {
    return `${heading('Camadas', 'Controle as informações que compõem a visualização territorial.')}
      <div class="explore-layout"><article class="panel"><div class="panel-head"><div><h2>Biblioteca de camadas</h2><p>Ative ou desative as informações disponíveis</p></div><button class="inline-link" data-action="reset-layers">Restaurar padrão</button></div><div class="layer-list">${layerRows()}</div></article><article class="panel"><div class="panel-head"><h2>Sobre as camadas</h2></div><p style="font-size:11px;line-height:1.7;color:#849391">As camadas permitem visualizar diferentes conjuntos de informações sobre uma mesma região. Você pode combinar elevação, hidrografia, cobertura do solo e limites administrativos.</p><div class="region-details"><div><small>Camadas ativas</small><strong>${state.layers.filter(l => l.on).length} de ${state.layers.length}</strong></div><button class="primary-button full" data-view="explore">Visualizar no mapa ${icon('arrow', 14)}</button></div></article></div>`;
  }

  function dataView() {
    const entries = [['Modelo digital de elevação', 'Relevo', 'GeoTIFF', 'Disponível'], ['Rede hidrográfica', 'Hidrografia', 'Shapefile', 'Disponível'], ['Uso e cobertura do solo', 'Ambiental', 'GeoJSON', 'Em atualização'], ['Limites municipais', 'Administrativo', 'Shapefile', 'Disponível']];
    return `${heading('Dados territoriais', 'Consulte os conjuntos de dados disponíveis para suas análises.')}
      <div class="stats-grid">${statCard('Conjuntos de dados','12','Fontes cadastradas','database')}${statCard('Categorias','03','Temas de informação','layers')}${statCard('Última atualização','Hoje','Dados demonstrativos','chart')}</div>
      <article class="panel table-wrap"><div class="panel-head"><div><h2>Catálogo de dados</h2><p>Fontes disponíveis no ambiente</p></div></div><table><thead><tr><th>Conjunto de dados</th><th>Categoria</th><th>Formato</th><th>Situação</th></tr></thead><tbody>${entries.map(r=>`<tr><td><strong>${r[0]}</strong></td><td>${r[1]}</td><td>${r[2]}</td><td><span class="status ${r[3] === 'Disponível' ? '' : 'gray'}">${r[3]}</span></td></tr>`).join('')}</tbody></table></article>`;
  }

  function reportsView() {
    return `${heading('Relatórios', 'Acompanhe os resultados e a atividade dos seus territórios.')}
      <div class="stats-grid">${statCard('Projetos analisados',String(state.projects.length).padStart(2,'0'),'No espaço de trabalho','folder')}${statCard('Camadas utilizadas',String(state.layers.filter(l=>l.on).length).padStart(2,'0'),'Ativas no momento','layers')}${statCard('Território em foco','PE','Pernambuco · Brasil','pin')}</div>
      <div class="dashboard-grid"><article class="panel"><div class="panel-head"><div><h2>Resumo do espaço de trabalho</h2><p>Indicadores demonstrativos</p></div></div><div style="display:grid;gap:17px;padding:16px 4px 8px">${[['Projetos com atividade',state.projects.length,4],['Camadas habilitadas',state.layers.filter(l=>l.on).length,4],['Categorias de dados',3,4]].map(([l,v,max])=>`<div><div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:7px"><strong>${l}</strong><span style="color:#879694">${v}</span></div><div style="height:8px;background:#edf2ef;border-radius:20px;overflow:hidden"><div style="height:100%;width:${v/max*100}%;background:#39b99b;border-radius:20px"></div></div></div>`).join('')}</div></article><article class="panel"><div class="panel-head"><h2>Exportação</h2></div><p style="font-size:11px;color:#879492;line-height:1.65">A geração de relatórios em PDF e a exportação de dados estarão disponíveis quando o backend estiver conectado.</p><button class="primary-button full" data-action="report-demo">Solicitar relatório ${icon('file',14)}</button></article></div>`;
  }

  function settingsView() {
    return `${heading('Configurações', 'Gerencie suas preferências de acesso e visualização.')}
      <article class="panel" style="max-width:720px"><div class="panel-head"><div><h2>Perfil</h2><p>Informações da conta atualmente conectada</p></div></div><div class="field"><span class="field-label">Nome</span><input value="${escapeHtml(state.user?.name || 'Clécio')}" disabled></div><div class="field"><span class="field-label">E-mail</span><input value="${escapeHtml(state.user?.email || 'usuario@exemplo.com')}" disabled></div><div class="form-options" style="justify-content:flex-start">${icon('check', 14)} Sessão local de demonstração</div><button class="primary-button" data-action="logout">Sair da conta ${icon('logout', 14)}</button></article>`;
  }

  function projectModal() {
    return `<div class="modal-backdrop" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">Novo projeto</h2><button class="close-button" data-action="close-modal" aria-label="Fechar">×</button></div><form id="project-form"><label class="field"><span class="field-label">Nome do projeto</span><input name="name" placeholder="Ex.: Mapeamento de área urbana" required maxlength="80"></label><label class="field"><span class="field-label">Localização</span><input name="place" placeholder="Ex.: Recife · PE" required maxlength="80"></label><label class="field"><span class="field-label">Tipo de projeto</span><input name="type" placeholder="Ex.: MAP, GIS ou H₂O" maxlength="12" value="MAP"></label><button class="primary-button full" type="submit">Criar projeto ${icon('arrow', 14)}</button></form></section></div>`;
  }

  function render() {
    if (state.view === 'login' || state.view === 'signup') return authView(state.view);
    const content = ({ dashboard: dashboardView, explore: exploreView, projects: projectsView, layers: layersView, data: dataView, reports: reportsView, settings: settingsView }[state.view] || dashboardView)();
    shell(content);
  }

  function enterApp(user) {
    state.user = user;
    state.view = 'dashboard';
    render();
    showToast(`Bem-vindo${user.name ? ', ' + user.name.split(' ')[0] : ''}!`);
  }

  app.addEventListener('submit', (event) => {
    if (event.target.id === 'auth-form') {
      event.preventDefault();
      const form = new FormData(event.target);
      const email = String(form.get('email') || '').trim();
      const password = String(form.get('password') || '');
      if (!email || !/^\S+@\S+\.\S+$/.test(email)) return showToast('Informe um e-mail válido.');
      if (password.length < (state.view === 'signup' ? 8 : 1)) return showToast(state.view === 'signup' ? 'A senha precisa ter pelo menos 8 caracteres.' : 'Informe sua senha.');
      if (state.view === 'signup') {
        const name = String(form.get('name') || '').trim();
        if (!name) return showToast('Informe seu nome completo.');
        if (password !== String(form.get('confirm') || '')) return showToast('As senhas não coincidem.');
        if (!form.get('terms')) return showToast('Aceite os termos para continuar.');
        const user = { name, email };
        localStorage.setItem('conecta-demo-user', JSON.stringify(user));
        enterApp(user);
      } else {
        const saved = localStorage.getItem('conecta-demo-user');
        let user = { name: email.split('@')[0], email };
        if (saved) {
          try { const previous = JSON.parse(saved); if (previous.email === email) user = previous; } catch (_) {}
        }
        if (form.get('remember')) localStorage.setItem('conecta-demo-user', JSON.stringify(user));
        enterApp(user);
      }
    }
    if (event.target.id === 'project-form') {
      event.preventDefault();
      const form = new FormData(event.target);
      const name = String(form.get('name') || '').trim();
      const place = String(form.get('place') || '').trim();
      if (!name || !place) return showToast('Preencha o nome e a localização.');
      state.projects.unshift({ name, place, updated: 'Criado agora', type: String(form.get('type') || 'MAP').trim().toUpperCase(), status: 'Em andamento' });
      state.modalOpen = false;
      state.view = 'projects';
      render();
      showToast('Projeto criado nesta demonstração.');
    }
  });

  app.addEventListener('click', (event) => {
    const viewButton = event.target.closest('[data-view]');
    if (viewButton) {
      state.view = viewButton.dataset.view;
      state.search = '';
      render();
      return;
    }
    const actionButton = event.target.closest('[data-action]');
    if (actionButton) {
      const action = actionButton.dataset.action;
      if (action === 'login' || action === 'signup') return authView(action);
      if (action === 'google') return showToast('Login Google será habilitado após configurar o serviço de autenticação.');
      if (action === 'forgot') return showToast('A recuperação de senha depende do serviço de autenticação.');
      if (action === 'logout') { state.user = null; state.view = 'login'; state.search = ''; return authView('login'); }
      if (action === 'notifications') return showToast('Você não tem notificações novas.');
      if (action === 'new-project') { state.modalOpen = true; return render(); }
      if (action === 'close-modal') { if (event.target.classList.contains('modal-backdrop') || actionButton.classList.contains('close-button')) { state.modalOpen = false; render(); } return; }
      if (action === 'search-region') {
        const input = document.getElementById('region-search');
        const value = input?.value.trim();
        if (!value) return showToast('Digite um município, endereço ou coordenadas.');
        state.selectedRegion = value;
        render();
        return showToast(`Região selecionada: ${value}.`);
      }
      if (action === 'save-region') return showToast(`${state.selectedRegion} foi adicionado aos territórios salvos (demonstração).`);
      if (action === 'reset-layers') { state.layers.forEach((l, i) => l.on = [true, true, false, true][i]); render(); return showToast('Camadas restauradas.'); }
      if (action === 'clear-search') { state.search = ''; render(); return; }
      if (action === 'zoom-in' || action === 'zoom-out') return showToast(action === 'zoom-in' ? 'Zoom aumentado (visualização demonstrativa).' : 'Zoom reduzido (visualização demonstrativa).');
      if (action === 'center-map') return showToast('Mapa centralizado na região selecionada.');
      if (action === 'fullscreen-map') return showToast('A visualização em tela cheia será conectada ao mapa interativo.');
      if (action === 'report-demo') return showToast('A exportação será habilitada quando o backend estiver conectado.');
    }
    const layerButton = event.target.closest('[data-layer]');
    if (layerButton) {
      const layer = state.layers[Number(layerButton.dataset.layer)];
      if (layer) { layer.on = !layer.on; render(); }
    }
  });

  app.addEventListener('input', (event) => {
    if (event.target.id === 'global-search' || event.target.id === 'page-search') {
      const value = event.target.value;
      state.search = value;
      const position = event.target.id === 'global-search' ? 'global' : 'page';
      if (state.view === 'dashboard' || state.view === 'projects') {
        const selectionStart = event.target.selectionStart;
        render();
        const target = document.getElementById(position === 'global' ? 'global-search' : 'page-search');
        if (target) { target.focus(); target.setSelectionRange(selectionStart, selectionStart); }
      }
    }
  });

  render();
})();

  </script>
</body>
</html>
