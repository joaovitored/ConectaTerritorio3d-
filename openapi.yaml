          nullable: true
        version:
          type: string
          maxLength: 50
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - format
      - id
      - layer
      - name
      - updated_at
      - url
    TokenResponse:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    TypeEnum:
      enum:
      - municipio
      - bairro
      - setor
      type: string
      description: |-
        * `municipio` - Município
        * `bairro` - Bairro
        * `setor` - Setor
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
