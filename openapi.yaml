openapi: 3.0.3
info:
  title: Conecta Território 3D API
  version: 1.0.0
paths:
  /api/v1/ai/query/:
    post:
      operationId: ai_query_create
      description: 'Pergunta em linguagem natural. A resposta é montada só com dados
        do banco e sempre cita a fonte. Limite: 10 requisições por minuto (429 ao
        exceder).'
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIQuery'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIQuery'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIQuery'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIQueryResponse'
              examples:
                ComDados:
                  value:
                    status: ok
                    parameters:
                      territory: '2611606'
                      category: zoning
                    answer: |-
                      Dados encontrados para Recife:
                      Zona ZUR-1: 12.5000 % (2024) — fonte: Prefeitura do Recife
                    sources:
                    - Prefeitura do Recife
                    records:
                    - id: 1
                      territory: '2611606'
                      parcel: null
                      category: zoning
                      name: Zona ZUR-1
                      value: '12.5000'
                      unit: '%'
                      period: '2024-01-01'
                      source: Prefeitura do Recife
                  summary: Com dados
                PerguntaSemTerritório:
                  value:
                    status: needs_more_info
                    message: Não identifiquei o território. Informe o município ou
                      bairro da análise.
                  summary: Pergunta sem território
                SemDados:
                  value:
                    status: no_data
                    message: Não há dados disponíveis para "Recife" na categoria "fiscal".
                  summary: Sem dados
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      description: POST usuário e senha → devolve o token. Limitado a 10 tentativas/min
        (anti força bruta).
      summary: 'Login: troca usuário e senha por um token'
      tags:
      - auth
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '400':
          description: No response body
        '429':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      description: Apaga o token do usuário (o próximo login gera outro).
      summary: 'Logout: invalida o token'
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me
      description: Quem está logado — o front usa para saber se o token ainda vale.
      summary: Dados do usuário logado
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: ''
  /api/v1/features/:
    get:
      operationId: features_list
      description: Feições em GeoJSON (EPSG:4326) filtradas por camada, área ou atributos.
        Use "bbox" com a área visível do mapa e "simplify" em zoom distante.
      parameters:
      - in: query
        name: bbox
        schema:
          type: string
        description: 'Recorte pela área visível: minLon,minLat,maxLon,maxLat'
      - in: query
        name: kind
        schema:
          type: string
        description: territory, parcel ou building (obrigatório se não houver "layer")
      - in: query
        name: land_use
        schema:
          type: string
        description: 'Lotes: uso do solo'
      - in: query
        name: layer
        schema:
          type: integer
        description: ID da camada; define o tipo de feição
      - in: query
        name: limit
        schema:
          type: integer
        description: Máximo de feições (padrão 200, máx. 1000)
      - in: query
        name: min_height
        schema:
          type: number
          format: double
        description: 'Edificações: altura mínima em metros'
      - in: query
        name: near
        schema:
          type: string
        description: 'Proximidade: ponto lon,lat'
      - in: query
        name: radius
        schema:
          type: number
          format: double
        description: Raio em metros para "near" (padrão 500, máx. 5000)
      - in: query
        name: simplify
        schema:
          type: number
          format: double
        description: 'Tolerância de simplificação em graus (ex.: 0.0001)'
      - in: query
        name: territory
        schema:
          type: string
        description: Código do território (feições dentro dele)
      - in: query
        name: type
        schema:
          type: string
        description: 'Territórios: municipio, bairro ou setor'
      - in: query
        name: use
        schema:
          type: string
        description: 'Edificações: uso'
      - in: query
        name: zoning
        schema:
          type: string
        description: 'Lotes: zoneamento'
      tags:
      - features
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureCollection'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/features/{kind}/{id}/:
    get:
      operationId: features_detail
      description: 'Detalhe da feição clicada no mapa (geometria completa, atributos
        e indicadores). "kind" e "id" vêm do id da feição no GeoJSON, ex.: parcel.12.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - features
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoJSONFeature'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/features/query/:
    post:
      operationId: features_query
      description: 'Filtro por área desenhada no mapa: devolve as feições que intersectam
        o polígono.'
      tags:
      - features
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureQuery'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FeatureQuery'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FeatureQuery'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureCollection'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/imports/:
    get:
      operationId: imports_list
      description: |-
        Importação de GeoJSON (somente administrador). Com arquivo, o processamento roda na hora
        e a resposta já traz o resultado; sem arquivo, o job fica 'pending' (carga externa).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - imports
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedImportJobList'
          description: ''
    post:
      operationId: imports_create
      description: |-
        Importação de GeoJSON (somente administrador). Com arquivo, o processamento roda na hora
        e a resposta já traz o resultado; sem arquivo, o job fica 'pending' (carga externa).
      tags:
      - imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportJob'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportJob'
          application/json:
            schema:
              $ref: '#/components/schemas/ImportJob'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
          description: ''
  /api/v1/imports/{id}/:
    get:
      operationId: imports_retrieve
      description: |-
        Importação de GeoJSON (somente administrador). Com arquivo, o processamento roda na hora
        e a resposta já traz o resultado; sem arquivo, o job fica 'pending' (carga externa).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this import job.
        required: true
      tags:
      - imports
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
          description: ''
  /api/v1/indicators/:
    get:
      operationId: indicators_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: Categoria do indicador
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: parcel
        schema:
          type: string
        description: Código cadastral do lote
      - in: query
        name: period
        schema:
          type: string
        description: Data do período, formato AAAA-MM-DD
      - in: query
        name: period_from
        schema:
          type: string
        description: 'Série temporal: período inicial (AAAA-MM-DD)'
      - in: query
        name: period_to
        schema:
          type: string
        description: 'Série temporal: período final (AAAA-MM-DD)'
      - in: query
        name: territory
        schema:
          type: string
        description: Código do território
      tags:
      - indicators
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIndicatorList'
          description: ''
  /api/v1/indicators/{id}/:
    get:
      operationId: indicators_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this indicator.
        required: true
      tags:
      - indicators
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Indicator'
          description: ''
  /api/v1/layers/:
    get:
      operationId: layers_list
      description: Catálogo de camadas. Camadas privadas só aparecem para usuários
        logados.
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: 'Categoria: cadastral, fiscal, zoning, infra, land_use, terrain
          ou socio_env'
      - in: query
        name: kind
        schema:
          type: string
        description: territory, parcel, building, tiles3d ou raster
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - layers
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLayerList'
          description: ''
  /api/v1/layers/{id}/:
    get:
      operationId: layers_retrieve
      description: Catálogo de camadas. Camadas privadas só aparecem para usuários
        logados.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this layer.
        required: true
      tags:
      - layers
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layer'
          description: ''
  /api/v1/search/:
    get:
      operationId: search_retrieve
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Nome, código, endereço, código de lote ou coordenada "lon,lat"
          (mínimo 2 caracteres)
        required: true
      tags:
      - search
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/territories/:
    get:
      operationId: territories_list
      parameters:
      - in: query
        name: bbox
        schema:
          type: string
        description: 'Extensão espacial: minLon,minLat,maxLon,maxLat'
      - in: query
        name: code
        schema:
          type: string
        description: Código exato do território
      - in: query
        name: contains
        schema:
          type: string
        description: Territórios que contêm o ponto lon,lat
      - in: query
        name: name
        schema:
          type: string
        description: Parte do nome (sem diferenciar maiúsculas)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: string
        description: 'Código do território pai (ex.: município de um bairro)'
      - in: query
        name: type
        schema:
          type: string
        description: municipio, bairro ou setor
      tags:
      - territories
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTerritoryList'
          description: ''
  /api/v1/territories/{id}/:
    get:
      operationId: territories_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this territory.
        required: true
      tags:
      - territories
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Territory'
          description: ''
  /api/v1/territories/{id}/summary/:
    get:
      operationId: territories_summary_retrieve
      description: 'Agregação espacial: lotes, edificações, uso do solo e indicadores
        mais recentes de cada categoria dentro do território.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this territory.
        required: true
      tags:
      - territories
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerritorySummary'
          description: ''
  /api/v1/tilesets/:
    get:
      operationId: tilesets_list
      description: Metadados e URLs de tiles 3D/raster. Os arquivos ficam em object
        storage/CDN.
      parameters:
      - in: query
        name: format
        schema:
          type: string
        description: 3dtiles, xyz, wmts ou terrain
      - in: query
        name: layer
        schema:
          type: integer
        description: ID da camada
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: territory
        schema:
          type: string
        description: Código do território
      tags:
      - tilesets
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTilesetList'
          description: ''
  /api/v1/tilesets/{id}/:
    get:
      operationId: tilesets_retrieve
      description: Metadados e URLs de tiles 3D/raster. Os arquivos ficam em object
        storage/CDN.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this tileset.
        required: true
      tags:
      - tilesets
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tileset'
          description: ''
components:
  schemas:
    AIParameters:
      type: object
      properties:
        territory:
          type: string
          description: Código do território identificado
        category:
          type: string
          nullable: true
          description: Categoria identificada (ou null)
      required:
      - category
      - territory
    AIQuery:
      type: object
      properties:
        question:
          type: string
          maxLength: 500
          minLength: 5
      required:
      - question
    AIQueryResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/AIQueryResponseStatusEnum'
        message:
          type: string
          description: Presente em needs_more_info e no_data
        parameters:
          $ref: '#/components/schemas/AIParameters'
        answer:
          type: string
          description: Texto montado só com dados do banco (status ok)
        sources:
          type: array
          items:
            type: string
        records:
          type: array
          items:
            $ref: '#/components/schemas/Indicator'
      required:
      - status
    AIQueryResponseStatusEnum:
      enum:
      - ok
      - needs_more_info
      - no_data
      type: string
      description: |-
        * `ok` - ok
        * `needs_more_info` - needs_more_info
        * `no_data` - no_data
    BlankEnum:
      enum:
      - ''
    CategoryEnum:
      enum:
      - cadastral
      - fiscal
      - zoning
      - infra
      - land_use
      - terrain
      - socio_env
      type: string
      description: |-
        * `cadastral` - Cadastral e imobiliário
        * `fiscal` - Fiscal
        * `zoning` - Zoneamento e legislação
        * `infra` - Infraestrutura
        * `land_use` - Uso e ocupação do solo
        * `terrain` - Terreno
        * `socio_env` - Socioeconômico e ambiental
    Error:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    FeatureCollection:
      type: object
      properties:
        type:
          type: string
          default: FeatureCollection
        features:
          type: array
          items:
            $ref: '#/components/schemas/GeoJSONFeature'
        numberMatched:
          type: integer
        numberReturned:
          type: integer
        truncated:
          type: boolean
          description: true quando há mais feições que o limite
      required:
      - features
      - numberMatched
      - numberReturned
      - truncated
    FeatureQuery:
      type: object
      description: Corpo do filtro por área desenhada no mapa.
      properties:
        kind:
          $ref: '#/components/schemas/FeatureQueryKindEnum'
        geometry:
          description: Polygon ou MultiPolygon GeoJSON em EPSG:4326
        limit:
          type: integer
          minimum: 1
        simplify:
          type: number
          format: double
          minimum: 0
      required:
      - geometry
      - kind
    FeatureQueryKindEnum:
      enum:
      - territory
      - parcel
      - building
      type: string
      description: |-
        * `territory` - territory
        * `parcel` - parcel
        * `building` - building
    FormatEnum:
      enum:
      - 3dtiles
      - xyz
      - wmts
      - terrain
      type: string
      description: |-
        * `3dtiles` - 3D Tiles
        * `xyz` - XYZ
        * `wmts` - WMTS
        * `terrain` - Terreno (quantized-mesh)
    GeoJSONFeature:
      type: object
      properties:
        type:
          type: string
          default: Feature
        id:
          type: string
          description: '"<tipo>.<id>", ex.: parcel.12'
        geometry:
          type: object
          additionalProperties: {}
        properties:
          type: object
          additionalProperties: {}
      required:
      - geometry
      - id
      - properties
    ImportJob:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        source:
          type: integer
        layer:
          type: integer
          nullable: true
        target:
          oneOf:
          - $ref: '#/components/schemas/TargetEnum'
          - $ref: '#/components/schemas/BlankEnum'
        file:
          type: string
          format: uri
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/ImportJobStatusEnum'
          readOnly: true
        version:
          type: string
          maxLength: 50
        records_processed:
          type: integer
          readOnly: true
        records_failed:
          type: integer
          readOnly: true
        error_log:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - error_log
      - finished_at
      - id
      - records_failed
      - records_processed
      - source
      - started_at
      - status
    ImportJobStatusEnum:
      enum:
      - pending
      - running
      - done
      - failed
      type: string
      description: |-
        * `pending` - Pendente
        * `running` - Em execução
        * `done` - Concluída
        * `failed` - Falhou
    Indicator:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        territory:
          type: string
        parcel:
          type: string
          nullable: true
        category:
          $ref: '#/components/schemas/CategoryEnum'
        name:
          type: string
          maxLength: 200
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        unit:
          type: string
          maxLength: 30
        period:
          type: string
          format: date
        source:
          type: string
      required:
      - category
      - id
      - name
      - period
      - source
      - territory
      - value
    Layer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        category:
          $ref: '#/components/schemas/CategoryEnum'
        kind:
          $ref: '#/components/schemas/LayerKindEnum'
        description:
          type: string
        source:
          type: string
        owner:
          type: string
          maxLength: 150
        scale:
          type: string
          maxLength: 100
        style: {}
        is_public:
          type: boolean
        updated_at:
          type: string
          format: date-time
