
services:
  db:
    image: postgis/postgis:16-3.5
    container_name: conecta_territorio_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: conecta_territorio
      POSTGRES_USER: conecta_user
      POSTGRES_PASSWORD: conecta_dev_123

    ports:
      - "5433:5432"

    volumes:
      - postgis_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U conecta_user -d conecta_territorio
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgis_data: